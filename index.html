<!doctype html>
<html lang="en" data-first-load="pending">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
        <meta name="apple-mobile-web-app-title" content="Idea Notes" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#020617" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="description" content="A calm, private place to collect ideas and thoughts." />
        <title>Idea Notes</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=block"
            rel="stylesheet"
        />
        <script>
            (function () {
                var preference = 'midnight';
                try {
                    var saved = localStorage.getItem('idea-notes.theme-preference');
                    if (!saved) {
                        var match = document.cookie.match(/(?:^|; )idea-notes\.theme=(system|light|midnight)(?:;|$)/);
                        saved = match && match[1];
                    }
                    if (saved === 'system' || saved === 'light' || saved === 'midnight') preference = saved;
                } catch (error) {
                    console.warn('[theme] Could not read the saved theme preference.', error);
                }

                var dark =
                    preference === 'midnight' ||
                    (preference === 'system' &&
                        window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches);
                var theme = dark ? 'midnight' : 'light';
                document.documentElement.classList.add(dark ? 'dark' : 'light');
                if (dark) document.documentElement.classList.add('theme-midnight');
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
                document
                    .querySelector('meta[name="theme-color"]')
                    ?.setAttribute('content', dark ? '#020617' : '#ffffff');
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
